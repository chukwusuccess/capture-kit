name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages and apps
        run: pnpm -r build

      - name: Run model tests
        run: pnpm test

      - name: Run serializer accuracy tests
        run: pnpm test:serializer

      - name: Run Sketch archive verification
        run: pnpm test:sketch

      - name: Run Figma destination tests
        run: pnpm test:figma

      - name: Run HTML destination tests
        run: pnpm test:html

      - name: Run Markdown AI export tests
        run: pnpm test:markdown

      - name: Run React Tailwind export tests
        run: pnpm test:react

      - name: Run visual accuracy diff harness
        run: pnpm test:diff

      - name: Package Chrome extension
        run: pnpm package:extension

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: capture-kit-extension
          path: dist/capture-kit-extension.zip
          retention-days: 14
