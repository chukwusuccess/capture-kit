# Orca gate: security + quality checks on every PR, whichever agent wrote it.
# Only problems a PR introduces block; scripts live in .github/orca/. Linux only (GitHub Free).
# Changing this file, .github/orca/ or CONSTRAINTS.md needs a human's approval (the orca pipeline asks).
name: orca-gate
on:
  pull_request:
concurrency:
  group: orca-gate-${{ github.head_ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  BASE: origin/${{ github.base_ref }} # via env, never interpolated into run: (shell injection)
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: install scanners (pinned, checksum-verified)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"; cd "$RUNNER_TEMP"
          curl -sSfLo gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz -C "$HOME/bin" gitleaks
          curl -sSfLo "$HOME/bin/osv-scanner" https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64
          echo "160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b  $HOME/bin/osv-scanner" | sha256sum -c -
          chmod +x "$HOME/bin/osv-scanner"
          pipx install semgrep==1.182.0 >/dev/null
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: secrets, vulnerable packages, unsafe code
        run: .github/orca/security.sh "$BASE"
      - name: quality floor (no silenced checks, skipped or deleted tests)
        if: always()
        run: node .github/orca/floor-guard.mjs --base "$BASE"

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.64.1
      - name: install browser tools
        run: |
          mkdir -p "$RUNNER_TEMP/orca-tools" && cd "$RUNNER_TEMP/orca-tools"
          npm init -y >/dev/null && npm i --no-audit --no-fund playwright@1.64.1 axe-core@4.14.0 >/dev/null
          npx playwright install --with-deps --only-shell chromium >/dev/null
          echo "ORCA_TOOLS=$RUNNER_TEMP/orca-tools" >> "$GITHUB_ENV"
      - name: pages load, no errors, no sideways scroll, accessible (vs main)
        run: .github/orca/browser.sh "$BASE"
        env:
          ORCA_OUT: ${{ runner.temp }}/orca-browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: orca-screenshots
          path: ${{ runner.temp }}/orca-browser
          retention-days: 14
          if-no-files-found: ignore
