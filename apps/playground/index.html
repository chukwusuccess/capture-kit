<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>capture-kit playground</title>
    <style>
      body { font: 14px system-ui, sans-serif; margin: 0; color: #1a1a1a; }
      #toolbar { padding: 12px; display: flex; gap: 8px; border-bottom: 1px solid #ddd; background: #f7f7f7; }
      #toolbar button { padding: 6px 12px; cursor: pointer; }
      /* --- demo content (what gets serialized) --- */
      #demo { padding: 24px; }
      .card {
        width: 320px; padding: 20px; border-radius: 12px;
        background: #ffffff; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
        font-family: Georgia, serif;
      }
      .card h1 { margin: 0 0 8px; font-size: 24px; color: #222222; text-align: center; }
      .card p { margin: 0 0 12px; font-size: 14px; line-height: 21px; color: #666666; text-align: center; }
      .banner {
        margin-top: 16px; padding: 12px 16px; border-radius: 8px;
        background: #4f46e5; color: #ffffff; font-family: Arial, sans-serif; font-size: 13px;
      }
      #demo img { display: block; margin-top: 16px; border-radius: 8px; }
      /* --- output panel --- */
      #output { padding: 0 24px 24px; }
      pre { background: #111; color: #ddd; padding: 16px; overflow: auto; max-height: 420px; font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="toolbar">
      <button id="run">Run serializer</button>
      <button id="dl-json" disabled>Download capture.json</button>
      <button id="dl-sketch" disabled>Download .sketch</button>
      <button id="dl-svg" disabled>Download .svg</button>
    </div>

    <div id="demo">
      <div class="card">
        <h1>Hello Capture</h1>
        <p>A small demo page the serializer walks: styled divs, text and an image.</p>
        <div class="banner">Rounded banner with a solid fill</div>
        <img
          width="96"
          height="96"
          alt="demo"
          src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI5NiIgaGVpZ2h0PSI5NiI+PHJlY3Qgd2lkdGg9Ijk2IiBoZWlnaHQ9Ijk2IiBmaWxsPSIjZTQ0Ii8+PHRleHQgeD0iNDgiIHk9IjU0IiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmaWxsPSJ3aGl0ZSIgZm9udC1mYW1pbHk9InNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTQiPmltZ2w8L3RleHQ+PC9zdmc+"
        />
      </div>
    </div>

    <div id="output">
      <pre id="json">(no capture yet — click "Run serializer")</pre>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
