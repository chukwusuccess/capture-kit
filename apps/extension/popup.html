<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>capture-kit</title>
    <style>
      /* Design-tool sidebar: one flat surface, sections split by hairlines,
         blue selection like a layers panel. Orange is the brand mark only. */
      :root {
        --surface: #ffffff;
        --canvas: #f5f5f5;
        --hover: #f0f0f0;
        --line: #e6e6e6;
        --ink: #1e1e1e;
        --ink-2: #4d4d4d;
        --muted: #8c8c8c;
        --select: #0d99ff;
        --select-ink: #0a7fd6;
        --select-soft: #e5f4ff;
        --brand: #ff5a26;
        --danger: #e03e1a;
        --ok: #14ae5c;
        --ease: cubic-bezier(0.23, 1, 0.32, 1);
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --surface: #2c2c2c;
          --canvas: #383838;
          --hover: #353535;
          --line: #444444;
          --ink: #f5f5f5;
          --ink-2: #cfcfcf;
          --muted: #9a9a9a;
          --select: #0c8ce9;
          --select-ink: #5cb8ff;
          --select-soft: rgba(12, 140, 233, 0.22);
          --danger: #ff7a5c;
          --ok: #3ccf7f;
          color-scheme: dark;
        }
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      body {
        width: 360px;
        margin: 0;
        background: var(--surface);
        color: var(--ink);
        font: 400 12px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      button {
        font: inherit;
        color: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--select);
        outline-offset: 1px;
        border-radius: 4px;
      }

      /* ---- header ---- */
      header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        border-bottom: 1px solid var(--line);
      }
      .logo {
        display: grid;
        place-items: center;
        flex: none;
        width: 28px;
        height: 28px;
        color: #fff;
        background: var(--brand);
        border-radius: 7px;
      }
      .who {
        flex: 1;
        min-width: 0;
      }
      h1 {
        margin: 0;
        font-size: 13px;
        font-weight: 600;
        line-height: 1.25;
      }
      .site {
        margin: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 11.5px;
        color: var(--muted);
      }
      .icon-btn {
        display: grid;
        place-items: center;
        flex: none;
        width: 30px;
        height: 30px;
        padding: 0;
        color: var(--ink-2);
        background: none;
        border: 0;
        border-radius: 6px;
        cursor: pointer;
        transition: background 0.12s ease, color 0.12s ease;
      }
      .icon-btn:hover:not(:disabled) {
        color: var(--ink);
        background: var(--hover);
      }
      .icon-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      /* ---- sections ---- */
      section.part {
        padding: 2px 14px 12px;
        border-bottom: 1px solid var(--line);
      }
      .part-head {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 30px;
      }
      h2 {
        flex: 1;
        margin: 0;
        font-size: 11.5px;
        font-weight: 600;
      }
      .text-btn {
        height: 24px;
        padding: 0 6px;
        font-size: 11.5px;
        color: var(--ink-2);
        background: none;
        border: 0;
        border-radius: 5px;
        cursor: pointer;
      }
      .text-btn:hover {
        color: var(--ink);
        background: var(--hover);
      }
      .tally {
        font-size: 11.5px;
        font-variant-numeric: tabular-nums;
        color: var(--muted);
      }

      /* ---- pages: search + layers-style list ---- */
      .search {
        display: flex;
        align-items: center;
        gap: 7px;
        height: 28px;
        padding: 0 9px;
        color: var(--muted);
        background: var(--canvas);
        border: 1px solid transparent;
        border-radius: 6px;
      }
      .search:focus-within {
        border-color: var(--select);
      }
      .search input {
        flex: 1;
        min-width: 0;
        padding: 0;
        font: inherit;
        color: var(--ink);
        background: none;
        border: 0;
        outline: none;
      }
      .search input::placeholder {
        color: var(--muted);
      }
      .search input::-webkit-search-cancel-button {
        display: none;
      }
      .groups {
        height: 160px;
        margin: 6px -14px 0;
        overflow-y: auto;
        overscroll-behavior: contain;
        scrollbar-width: thin;
      }
      .grp-head,
      .pg {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 26px;
        padding: 0 14px;
      }
      .grp-head:hover,
      .pg:hover {
        background: var(--hover);
      }
      .pg:has(.cb:checked) {
        background: var(--select-soft);
      }
      .grp-toggle {
        display: grid;
        place-items: center;
        flex: none;
        width: 14px;
        height: 14px;
        margin-left: -4px;
        padding: 0;
        color: var(--muted);
        background: none;
        border: 0;
        border-radius: 3px;
        cursor: pointer;
      }
      .grp-toggle svg {
        transition: transform 0.15s var(--ease);
      }
      .grp-toggle[aria-expanded="false"] svg {
        transform: rotate(-90deg);
      }
      .grp-pick,
      .pg {
        cursor: pointer;
        user-select: none;
      }
      .grp-pick {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: 1;
        min-width: 0;
        height: 100%;
      }
      .grp-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-weight: 600;
      }
      .grp-count {
        font-size: 11px;
        font-variant-numeric: tabular-nums;
        color: var(--muted);
      }
      .grp-list {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .grp-list .pg {
        padding-left: 32px;
      }
      .pg-path {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--ink-2);
      }
      .pg-path .dim {
        color: var(--muted);
      }
      .pg:has(.cb:checked) .pg-path {
        color: var(--ink);
      }
      .here {
        flex: none;
        padding: 1px 6px;
        font-size: 10.5px;
        font-weight: 600;
        color: var(--select-ink);
        background: var(--select-soft);
        border-radius: 4px;
      }
      .pg:has(.cb:checked) .here {
        color: #fff;
        background: var(--select);
      }
      .cb {
        appearance: none;
        flex: none;
        display: grid;
        place-content: center;
        width: 14px;
        height: 14px;
        margin: 0;
        background: var(--surface);
        border: 1px solid var(--muted);
        border-radius: 3px;
        cursor: pointer;
      }
      .cb::before {
        content: "";
        width: 7px;
        height: 3.5px;
        margin-top: -2px;
        border: solid #fff;
        border-width: 0 0 1.75px 1.75px;
        transform: rotate(-45deg) scale(0.5);
        opacity: 0;
        transition: transform 0.14s var(--ease), opacity 0.1s ease;
      }
      .cb:checked,
      .cb:indeterminate {
        background: var(--select);
        border-color: var(--select);
      }
      .cb:checked::before {
        transform: rotate(-45deg) scale(1);
        opacity: 1;
      }
      .cb:indeterminate::before {
        width: 7px;
        height: 0;
        margin: 0;
        border-width: 0 0 1.75px;
        transform: none;
        opacity: 1;
      }
      .note {
        margin: 0;
        padding: 18px 14px;
        text-align: center;
        color: var(--muted);
      }
      .spin {
        display: inline-block;
        width: 10px;
        height: 10px;
        margin-right: 6px;
        vertical-align: -1px;
        border: 1.5px solid var(--line);
        border-top-color: var(--select);
        border-radius: 50%;
        animation: spin 0.6s linear infinite;
      }

      /* ---- sizes: device frames drawn to their real proportions ---- */
      .sizes {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 4px;
      }
      .size {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        padding: 5px 0 4px;
        background: none;
        border: 1px solid transparent;
        border-radius: 6px;
        cursor: pointer;
        transition: background 0.12s ease, border-color 0.12s ease;
      }
      .size:hover {
        background: var(--hover);
      }
      .size[aria-pressed="true"] {
        background: var(--select-soft);
        border-color: var(--select);
      }
      .device {
        display: grid;
        place-items: end center;
        height: 24px;
        margin-bottom: 2px;
      }
      .device i {
        display: block;
        border: 1.5px solid var(--muted);
        border-radius: 2px;
        transition: border-color 0.12s ease, background 0.12s ease;
      }
      .size[aria-pressed="true"] .device i {
        border-color: var(--select);
        background: color-mix(in srgb, var(--select) 14%, transparent);
      }
      .device .tab-now {
        border-style: dashed;
      }
      .size b {
        font-size: 11px;
        font-weight: 500;
        color: var(--ink-2);
      }
      .size small {
        font-size: 10.5px;
        font-variant-numeric: tabular-nums;
        color: var(--muted);
      }
      .size[aria-pressed="true"] b,
      .size[aria-pressed="true"] small {
        color: var(--select-ink);
      }

      /* ---- export ---- */
      .formats {
        display: flex;
        gap: 2px;
        padding: 2px;
        background: var(--canvas);
        border-radius: 6px;
      }
      .formats label {
        flex: 1;
        cursor: pointer;
      }
      .formats input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }
      .formats span {
        display: grid;
        place-items: center;
        height: 24px;
        font-size: 11.5px;
        color: var(--ink-2);
        border-radius: 4px;
      }
      .formats label:hover span {
        color: var(--ink);
      }
      .formats input:checked + span {
        font-weight: 600;
        color: var(--ink);
        background: var(--surface);
        box-shadow: 0 0 0 1px var(--line), 0 1px 2px rgba(0, 0, 0, 0.08);
      }
      .formats input:focus-visible + span {
        outline: 2px solid var(--select);
      }
      .opt {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 9px;
        color: var(--ink-2);
        cursor: pointer;
        user-select: none;
      }

      /* ---- run ---- */
      .run {
        padding: 10px 14px;
      }
      .cta {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 44px;
        padding: 0 12px;
        color: #fff;
        background: var(--select);
        border: 0;
        border-radius: 8px;
        cursor: pointer;
        transition: transform 0.12s var(--ease), filter 0.12s ease;
      }
      .cta:hover:not(:disabled) {
        filter: brightness(1.08);
      }
      .cta:active:not(:disabled) {
        transform: scale(0.98);
      }
      .cta:disabled {
        color: var(--muted);
        background: var(--canvas);
        cursor: not-allowed;
      }
      .cta-title {
        font-size: 13px;
        font-weight: 600;
      }
      .cta-sub {
        font-size: 11px;
        opacity: 0.8;
      }
      .status {
        display: flex;
        align-items: center;
        gap: 7px;
        min-height: 18px;
        margin-top: 7px;
        font-size: 11.5px;
        color: var(--muted);
      }
      .status-text {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .dot {
        flex: none;
        width: 6px;
        height: 6px;
        background: var(--muted);
        border-radius: 50%;
      }
      .status.ok .dot {
        background: var(--ok);
      }
      .status.error {
        color: var(--danger);
      }
      .status.error .dot {
        background: var(--danger);
      }
      .status.busy .dot {
        width: 10px;
        height: 10px;
        background: none;
        border: 1.5px solid var(--line);
        border-top-color: var(--select);
        animation: spin 0.6s linear infinite;
      }
      .status .text-btn {
        height: 20px;
        color: var(--select-ink);
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
          animation-duration: 1.5s !important;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <span class="logo" aria-hidden="true">
        <svg width="15" height="15" viewBox="0 0 20 20" fill="none">
          <path d="M2.5 6.5v-3a1 1 0 0 1 1-1h3M13.5 2.5h3a1 1 0 0 1 1 1v3M17.5 13.5v3a1 1 0 0 1-1 1h-3M6.5 17.5h-3a1 1 0 0 1-1-1v-3"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          <circle cx="10" cy="10" r="3.4" stroke="currentColor" stroke-width="2" />
        </svg>
      </span>
      <div class="who">
        <h1>capture-kit</h1>
        <p class="site" id="site-line">Reading this tab…</p>
      </div>
      <button type="button" class="icon-btn" id="pick-btn" title="Pick one element on this page" aria-label="Pick one element on this page">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M3 1.5h-.5a1 1 0 0 0-1 1V3M13 1.5h.5a1 1 0 0 1 1 1V3M1.5 13v.5a1 1 0 0 0 1 1H3M6 1.5h4M1.5 6v4M14.5 6v1"
            stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
          <path d="m8 8 6.5 2.3-2.8 1.1-1.1 2.8L8 8Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" />
        </svg>
      </button>
    </header>

    <section class="part" aria-labelledby="pages-h">
      <div class="part-head">
        <h2 id="pages-h">Pages</h2>
        <button type="button" class="text-btn" id="sel-all">All</button>
        <button type="button" class="text-btn" id="sel-none">None</button>
      </div>
      <label class="search">
        <svg width="12" height="12" viewBox="0 0 13 13" fill="none" aria-hidden="true">
          <circle cx="5.5" cy="5.5" r="4" stroke="currentColor" stroke-width="1.4" />
          <path d="m8.5 8.5 3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
        </svg>
        <input type="search" id="page-search" placeholder="Filter pages" aria-label="Filter pages" autocomplete="off" />
      </label>
      <div class="groups" id="page-groups" role="group" aria-label="Pages to capture">
        <p class="note"><span class="spin"></span>Finding pages on this site…</p>
      </div>
    </section>

    <section class="part" aria-labelledby="sizes-h">
      <div class="part-head">
        <h2 id="sizes-h">Sizes</h2>
        <span class="tally" id="sizes-tally"></span>
      </div>
      <div class="sizes" role="group" aria-labelledby="sizes-h">
        <button type="button" class="size" data-size="current" aria-pressed="true">
          <span class="device"><i class="tab-now" style="width: 30px; height: 19px"></i></span>
          <b>This tab</b><small id="current-w">—</small>
        </button>
        <button type="button" class="size" data-size="1920" aria-pressed="false">
          <span class="device"><i style="width: 36px; height: 22px"></i></span>
          <b>Desktop</b><small>1920</small>
        </button>
        <button type="button" class="size" data-size="1440" aria-pressed="false">
          <span class="device"><i style="width: 30px; height: 19px"></i></span>
          <b>Laptop</b><small>1440</small>
        </button>
        <button type="button" class="size" data-size="768" aria-pressed="false">
          <span class="device"><i style="width: 17px; height: 23px"></i></span>
          <b>Tablet</b><small>768</small>
        </button>
        <button type="button" class="size" data-size="390" aria-pressed="false">
          <span class="device"><i style="width: 11px; height: 23px"></i></span>
          <b>Mobile</b><small>390</small>
        </button>
      </div>
    </section>

    <section class="part" aria-labelledby="export-h">
      <div class="part-head">
        <h2 id="export-h">Export as</h2>
      </div>
      <div class="formats" role="radiogroup" aria-labelledby="export-h">
        <label><input type="radio" name="format" value="figma" checked /><span>Figma</span></label>
        <label><input type="radio" name="format" value="sketch" /><span>Sketch</span></label>
        <label><input type="radio" name="format" value="svg" /><span>SVG</span></label>
        <label><input type="radio" name="format" value="html" /><span>HTML</span></label>
        <label><input type="radio" name="format" value="json" /><span>JSON</span></label>
      </div>
      <label class="opt">
        <input type="checkbox" class="cb" id="opt-scroll-stitch" />
        Scroll each page first to load lazy images
      </label>
    </section>

    <div class="run">
      <button type="button" id="capture-btn" class="cta" disabled>
        <span class="cta-title" id="capture-title">Capture</span>
        <span class="cta-sub" id="capture-sub">Finding pages…</span>
      </button>
      <div class="status" id="status" role="status">
        <span class="dot"></span>
        <span class="status-text" id="status-text">Ready</span>
        <button type="button" class="text-btn" id="figma-btn" hidden>Copy again</button>
      </div>
    </div>

    <script type="module" src="./src/popup.ts"></script>
  </body>
</html>
