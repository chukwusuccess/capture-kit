<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>capture-kit</title>
    <style>
      body {
        width: 240px;
        padding: 16px;
        font-family: system-ui, -apple-system, sans-serif;
        margin: 0;
        background: #fafafa;
        color: #111;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 12px;
      }
      button {
        width: 100%;
        padding: 10px;
        font-size: 14px;
        font-weight: 600;
        border: 1px solid #222;
        border-radius: 6px;
        background: #111;
        color: #fff;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      #status {
        margin-top: 10px;
        font-size: 12px;
        color: #555;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <h1>capture-kit</h1>
    <button id="capture-btn">Capture this tab</button>
    <div id="status">Ready</div>
    <script type="module" src="./src/popup.ts"></script>
  </body>
</html>
