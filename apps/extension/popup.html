<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>capture-kit</title>
    <style>
      body {
        width: 260px;
        padding: 16px;
        font-family: system-ui, -apple-system, sans-serif;
        margin: 0;
        background: #fafafa;
        color: #111;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 12px;
      }
      .actions {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 12px;
      }
      button {
        width: 100%;
        padding: 9px;
        font-size: 13px;
        font-weight: 600;
        border: 1px solid #222;
        border-radius: 6px;
        background: #111;
        color: #fff;
        cursor: pointer;
      }
      button.secondary {
        background: #ffffff;
        color: #111;
        border-color: #ccc;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .options-box {
        border-top: 1px solid #e5e5e5;
        padding-top: 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .option-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 11px;
        color: #444;
      }
      .option-row input[type="checkbox"] {
        margin-right: 6px;
      }
      .option-row select {
        padding: 3px 6px;
        font-size: 11px;
        border-radius: 4px;
        border: 1px solid #ccc;
      }
      #status {
        margin-top: 12px;
        font-size: 12px;
        color: #555;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <h1>capture-kit</h1>
    <div class="actions">
      <button id="capture-btn">Capture this tab</button>
      <button id="pick-btn" class="secondary">Pick element</button>
      <button id="figma-btn" class="secondary" disabled>Copy to Figma</button>
    </div>

    <div class="options-box">
      <label class="option-row">
        <div>
          <input type="checkbox" id="opt-scroll-stitch" />
          <span>Auto-scroll</span>
        </div>
      </label>
      <label class="option-row">
        <span>Format:</span>
        <select id="opt-format">
          <option value="json">capture.json</option>
          <option value="sketch">.sketch</option>
          <option value="svg">.svg</option>
          <option value="html">.html</option>
          <option value="figma">Figma clipboard</option>
        </select>
      </label>
    </div>

    <div id="status">Ready</div>
    <script type="module" src="./src/popup.ts"></script>
  </body>
</html>
