<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>capture-kit</title>
    <style>
      :root {
        --bg: #f6f5f3;
        --card: #ffffff;
        --sunk: #efede9;
        --ink: #16181c;
        --ink-2: #4a505a;
        --muted: #878c95;
        --line: rgba(22, 24, 28, 0.08);
        --line-2: rgba(22, 24, 28, 0.16);
        --accent: #ff5a26;
        --accent-ink: #d9440f;
        --accent-soft: rgba(255, 90, 38, 0.12);
        --danger: #d92d20;
        --cta: #16181c;
        --cta-hover: #2a2d33;
        --cta-ink: #ffffff;
        --shadow: 0 0 0 1px var(--line), 0 1px 2px rgba(22, 24, 28, 0.04);
        --raised: 0 0 0 1px var(--line), 0 1px 3px rgba(22, 24, 28, 0.1);
        --ease: cubic-bezier(0.23, 1, 0.32, 1);
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111214;
          --card: #1a1c1f;
          --sunk: #0c0d0f;
          --ink: #f1f1f2;
          --ink-2: #b8bcc3;
          --muted: #7d828b;
          --line: rgba(255, 255, 255, 0.07);
          --line-2: rgba(255, 255, 255, 0.16);
          --accent-ink: #ff7a4d;
          --accent-soft: rgba(255, 90, 38, 0.16);
          --danger: #ff6b5e;
          --cta: #ff5a26;
          --cta-hover: #ff6d3d;
          --cta-ink: #16181c;
          --shadow: 0 0 0 1px var(--line);
          --raised: 0 0 0 1px var(--line-2), 0 1px 3px rgba(0, 0, 0, 0.5);
          color-scheme: dark;
        }
        .seg input:checked + span,
        .chip input:checked + span {
          background: #2a2d32;
        }
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      body {
        width: 360px;
        margin: 0;
        padding: 12px 12px 10px;
        background: var(--bg);
        color: var(--ink);
        font: 400 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
        border-radius: 6px;
      }

      /* ---- header ---- */
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin: 2px 2px 8px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .logo {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        background: var(--accent);
        border-radius: 8px;
        color: #fff;
        box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.08), 0 1px 2px rgba(255, 90, 38, 0.4);
      }
      h1 {
        margin: 0;
        font-size: 14px;
        font-weight: 650;
        letter-spacing: -0.015em;
        line-height: 1.2;
      }
      .brand p {
        margin: 1px 0 0;
        font-size: 11.5px;
        color: var(--muted);
      }
      .tabinfo {
        min-width: 0;
        padding: 4px 9px;
        text-align: right;
        background: var(--card);
        border-radius: 8px;
        box-shadow: var(--shadow);
        font-variant-numeric: tabular-nums;
      }
      .tabinfo .host {
        display: block;
        max-width: 150px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 11.5px;
        font-weight: 550;
        color: var(--ink);
      }
      .tabinfo .size {
        display: block;
        font-size: 10.5px;
        color: var(--muted);
      }
      .tabinfo .size:empty {
        display: none;
      }

      /* ---- panels ---- */
      .panel {
        min-width: 0;
        margin: 0 0 8px;
        padding: 10px 12px;
        border: 0;
        background: var(--card);
        border-radius: 12px;
        box-shadow: var(--shadow);
        transition: opacity 0.15s ease;
      }
      .panel.off {
        opacity: 0.45;
        pointer-events: none;
      }
      legend {
        float: left;
        width: 100%;
        margin: 0 0 8px;
        padding: 0;
        font-size: 11px;
        font-weight: 600;
        color: var(--muted);
      }
      legend + * {
        clear: both;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }

      /* ---- segmented controls (scope + format share one look) ---- */
      .seg,
      .chips {
        display: flex;
        gap: 2px;
        padding: 2px;
        background: var(--sunk);
        border-radius: 9px;
      }
      .seg label,
      .chip {
        flex: 1;
        min-width: 0;
        cursor: pointer;
      }
      .seg input,
      .chip input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }
      .seg label > span,
      .chip span {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        height: 28px;
        font-size: 12.5px;
        font-weight: 550;
        color: var(--muted);
        border-radius: 7px;
        transition: background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
      }
      .chip span {
        height: 28px;
        font-size: 12px;
      }
      .seg label:hover > span,
      .chip:hover span {
        color: var(--ink);
      }
      .seg input:checked + span,
      .chip input:checked + span {
        color: var(--ink);
        background: var(--card);
        box-shadow: var(--raised);
      }
      .seg input:focus-visible + span,
      .chip input:focus-visible + span {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }
      .count[hidden] {
        display: none;
      }
      .count {
        font-size: 10.5px;
        font-weight: 650;
        font-variant-numeric: tabular-nums;
        line-height: 16px;
        padding: 0 6px;
        color: var(--accent-ink);
        background: var(--accent-soft);
        border-radius: 99px;
      }
      .scope-note {
        margin: 10px 2px 0;
        font-size: 11.5px;
        color: var(--muted);
      }

      /* ---- discovered page list ---- */
      .page-list {
        margin: 10px 0 0;
        padding: 6px 0 0;
        list-style: none;
        border-top: 1px solid var(--line);
        max-height: 132px;
        overflow-y: auto;
      }
      .page-list li {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 24px;
        padding: 0 2px;
        font: 450 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: var(--ink-2);
      }
      .page-list li svg {
        flex: none;
        color: var(--muted);
      }
      .page-list li span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .page-list li.more {
        color: var(--muted);
        font-family: inherit;
      }

      /* ---- page picker ---- */
      .picker {
        margin-top: 10px;
      }
      .picker-bar {
        display: flex;
        align-items: center;
        gap: 2px;
      }
      .search {
        display: flex;
        align-items: center;
        gap: 6px;
        flex: 1;
        min-width: 0;
        height: 28px;
        margin-right: 4px;
        padding: 0 8px;
        color: var(--muted);
        background: var(--sunk);
        border: 1px solid transparent;
        border-radius: 7px;
        transition: border-color 0.12s ease, box-shadow 0.12s ease;
      }
      .search:focus-within {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }
      .search input {
        flex: 1;
        min-width: 0;
        padding: 0;
        font: inherit;
        font-size: 12px;
        color: var(--ink);
        background: none;
        border: 0;
        outline: none;
      }
      .search input::placeholder {
        color: var(--muted);
      }
      .link {
        height: 28px;
        padding: 0 7px;
        font: inherit;
        font-size: 11.5px;
        font-weight: 550;
        color: var(--ink-2);
        background: none;
        border: 0;
        border-radius: 6px;
        cursor: pointer;
      }
      .link:hover {
        color: var(--ink);
        background: var(--sunk);
      }
      .groups {
        max-height: 172px;
        margin: 8px -6px 0;
        padding: 0 6px;
        overflow-y: auto;
        overscroll-behavior: contain;
        scrollbar-width: thin;
      }
      .grp + .grp {
        margin-top: 4px;
        padding-top: 4px;
        border-top: 1px solid var(--line);
      }
      .grp-head,
      .pg {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 26px;
        margin: 0 -6px;
        padding: 0 6px;
        border-radius: 6px;
      }
      .grp-head:hover,
      .pg:hover {
        background: var(--sunk);
      }
      .grp-pick {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: 1;
        min-width: 0;
        height: 100%;
        cursor: pointer;
        user-select: none;
      }
      .grp-name {
        font-size: 12px;
        font-weight: 600;
        color: var(--ink);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .grp-count {
        font-size: 11px;
        font-variant-numeric: tabular-nums;
        color: var(--muted);
      }
      .grp-toggle {
        display: grid;
        place-items: center;
        flex: none;
        width: 20px;
        height: 20px;
        padding: 0;
        color: var(--muted);
        background: none;
        border: 0;
        border-radius: 5px;
        cursor: pointer;
      }
      .grp-toggle:hover {
        color: var(--ink);
        background: var(--line);
      }
      .grp-toggle svg {
        transition: transform 0.15s var(--ease);
      }
      .grp-toggle[aria-expanded="false"] svg {
        transform: rotate(-90deg);
      }
      .grp-list {
        margin: 0;
        padding: 0 0 0 16px;
        list-style: none;
      }
      .pg {
        cursor: pointer;
        user-select: none;
      }
      .pg-path {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font: 450 11.5px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: var(--ink-2);
      }
      .pg-path .dim {
        color: var(--muted);
      }
      .pg:has(.cb:checked) .pg-path {
        color: var(--ink);
      }
      .cb {
        appearance: none;
        flex: none;
        width: 14px;
        height: 14px;
        margin: 0;
        display: grid;
        place-content: center;
        background: var(--card);
        border: 1.5px solid var(--line-2);
        border-radius: 4px;
        cursor: pointer;
        transition: background 0.12s ease, border-color 0.12s ease;
      }
      .cb::before {
        content: "";
        width: 7px;
        height: 3.5px;
        margin-top: -2px;
        border: solid #fff;
        border-width: 0 0 2px 2px;
        transform: rotate(-45deg) scale(0.6);
        opacity: 0;
        transition: transform 0.15s var(--ease), opacity 0.1s ease;
      }
      .cb:checked,
      .cb:indeterminate {
        background: var(--accent);
        border-color: var(--accent);
      }
      .cb:checked::before {
        transform: rotate(-45deg) scale(1);
        opacity: 1;
      }
      .cb:indeterminate::before {
        width: 7px;
        height: 0;
        margin: 0;
        border-width: 0 0 2px;
        transform: none;
        opacity: 1;
      }
      .picker-foot {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        margin: 6px 0 0;
        padding-top: 7px;
        border-top: 1px solid var(--line);
        font-size: 11px;
        font-variant-numeric: tabular-nums;
        color: var(--muted);
      }
      .picker-foot.over {
        color: var(--danger);
      }
      .empty {
        margin: 12px 0;
        font-size: 11.5px;
        text-align: center;
        color: var(--muted);
      }

      /* ---- viewport rows ---- */
      .vp-row {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 30px;
        margin: 0 -6px;
        padding: 0 6px;
        border-radius: 8px;
        transition: background 0.12s ease;
      }
      .vp-row:hover {
        background: var(--sunk);
      }
      .vp-pick {
        display: flex;
        align-items: center;
        gap: 10px;
        flex: 1;
        min-width: 0;
        height: 100%;
        cursor: pointer;
        user-select: none;
      }
      .vp-pick svg {
        flex: none;
        color: var(--muted);
        transition: color 0.12s ease;
      }
      .vp-pick span {
        font-size: 12.5px;
        font-weight: 500;
        color: var(--ink-2);
      }
      .vp-pick:has(input:checked) span {
        color: var(--ink);
      }
      .vp-pick:has(input:checked) svg {
        color: var(--ink);
      }
      .vp-row input[type="checkbox"] {
        appearance: none;
        flex: none;
        width: 16px;
        height: 16px;
        margin: 0;
        display: grid;
        place-content: center;
        background: var(--card);
        border: 1.5px solid var(--line-2);
        border-radius: 5px;
        cursor: pointer;
        transition: background 0.12s ease, border-color 0.12s ease;
      }
      .vp-row input[type="checkbox"]::before {
        content: "";
        width: 8px;
        height: 4px;
        margin-top: -2px;
        border: solid #fff;
        border-width: 0 0 2px 2px;
        border-radius: 1px;
        transform: rotate(-45deg) scale(0.6);
        opacity: 0;
        transition: transform 0.15s var(--ease), opacity 0.1s ease;
      }
      .vp-row input[type="checkbox"]:checked {
        background: var(--accent);
        border-color: var(--accent);
      }
      .vp-row input[type="checkbox"]:checked::before {
        transform: rotate(-45deg) scale(1);
        opacity: 1;
      }
      .vp-w::-webkit-outer-spin-button,
      .vp-w::-webkit-inner-spin-button {
        appearance: none;
        margin: 0;
      }
      .vp-w,
      .vp-live {
        width: 64px;
        height: 26px;
        padding: 0 8px;
        font: inherit;
        font-size: 12px;
        line-height: 26px;
        font-variant-numeric: tabular-nums;
        text-align: right;
      }
      .vp-w {
        color: var(--ink);
        background: var(--sunk);
        border: 1px solid transparent;
        border-radius: 6px;
        transition: border-color 0.12s ease, background 0.12s ease;
      }
      .vp-row:hover .vp-w {
        background: var(--card);
        border-color: var(--line-2);
      }
      .vp-w:focus {
        outline: none;
        background: var(--card);
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }
      .vp-live {
        color: var(--muted);
      }
      .vp-px {
        width: 14px;
        font-size: 11px;
        color: var(--muted);
      }

      /* ---- auto-scroll toggle ---- */
      .toggle-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid var(--line);
        cursor: pointer;
        user-select: none;
      }
      .toggle-row span {
        font-size: 12.5px;
        color: var(--ink-2);
      }
      .divider {
        display: none;
      }
      .switch {
        appearance: none;
        flex: none;
        width: 30px;
        height: 18px;
        margin: 0;
        position: relative;
        background: var(--line-2);
        border-radius: 999px;
        cursor: pointer;
        transition: background 0.15s ease;
      }
      .switch::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 14px;
        height: 14px;
        background: #fff;
        border-radius: 50%;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        transition: transform 0.18s var(--ease);
      }
      .switch:checked {
        background: var(--accent);
      }
      .switch:checked::after {
        transform: translateX(12px);
      }

      /* ---- action buttons ---- */
      .card {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        min-width: 0;
        padding: 10px 12px;
        font: inherit;
        text-align: left;
        color: var(--ink);
        background: var(--card);
        border: 0;
        border-radius: 10px;
        box-shadow: var(--shadow);
        cursor: pointer;
        transition: transform 0.12s var(--ease), background 0.15s ease, box-shadow 0.15s ease;
      }
      .card > svg {
        flex: none;
      }
      .card:active:not(:disabled) {
        transform: scale(0.97);
      }
      .card:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .card .txt {
        display: flex;
        flex-direction: column;
        gap: 1px;
        min-width: 0;
      }
      .card .title {
        font-size: 12.5px;
        font-weight: 600;
        letter-spacing: -0.005em;
      }
      .card .sub {
        font-size: 11px;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .hero {
        margin: 0 0 8px;
        padding: 10px 14px;
        color: var(--cta-ink);
        background: var(--cta);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.15), 0 6px 16px -6px rgba(0, 0, 0, 0.3);
      }
      .hero > svg {
        color: var(--accent);
      }
      .hero .title {
        font-size: 13.5px;
      }
      .hero .sub {
        color: inherit;
        opacity: 0.62;
      }
      .hero .marks {
        display: none;
      }
      .grid2 {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 8px;
      }
      .pick > svg {
        color: var(--accent);
      }
      .figma > svg {
        color: var(--ink);
      }
      @media (hover: hover) {
        .hero:hover:not(:disabled) {
          background: var(--cta-hover);
        }
        .pick:hover:not(:disabled),
        .figma:hover:not(:disabled) {
          box-shadow: var(--raised);
        }
      }
      @media (prefers-color-scheme: dark) {
        .hero > svg {
          color: var(--cta-ink);
        }
      }

      /* ---- status footer ---- */
      footer {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 8px;
        padding: 0 4px;
        min-height: 18px;
        font-size: 11.5px;
        font-variant-numeric: tabular-nums;
        color: var(--muted);
      }
      #status-text {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      footer.error {
        color: var(--danger);
      }
      .dot {
        flex: none;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #3fb950;
        box-shadow: 0 0 0 3px rgba(63, 185, 80, 0.15);
      }
      footer.busy .dot {
        width: 10px;
        height: 10px;
        background: transparent;
        box-shadow: none;
        border: 1.5px solid var(--line-2);
        border-top-color: var(--accent);
        animation: spin 0.6s linear infinite;
      }
      footer.ok .dot {
        background: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }
      footer.error .dot {
        background: var(--danger);
        box-shadow: 0 0 0 3px rgba(217, 45, 32, 0.15);
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
          animation-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <svg width="15" height="15" viewBox="0 0 20 20" fill="none">
            <path d="M2.5 6.5v-3a1 1 0 0 1 1-1h3M13.5 2.5h3a1 1 0 0 1 1 1v3M17.5 13.5v3a1 1 0 0 1-1 1h-3M6.5 17.5h-3a1 1 0 0 1-1-1v-3"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            <circle cx="10" cy="10" r="3.4" stroke="currentColor" stroke-width="2" />
          </svg>
        </span>
        <div>
          <h1>capture-kit</h1>
          <p>site → design file</p>
        </div>
      </div>
      <div class="tabinfo">
        <span class="host" id="tab-host">current tab</span>
        <span class="size" id="tab-size"></span>
      </div>
    </header>

    <fieldset class="panel">
      <legend class="sr-only">Pages</legend>
      <div class="seg">
        <label>
          <input type="radio" name="scope" value="page" checked />
          <span>This page</span>
        </label>
        <label>
          <input type="radio" name="scope" value="site" />
          <span>Whole site <span class="count" id="page-count" hidden></span></span>
        </label>
      </div>
      <p class="scope-note" id="scope-note" hidden></p>
      <div class="picker" id="picker" hidden>
        <div class="picker-bar">
          <label class="search">
            <svg width="13" height="13" viewBox="0 0 13 13" fill="none" aria-hidden="true">
              <circle cx="5.5" cy="5.5" r="4" stroke="currentColor" stroke-width="1.4" />
              <path d="m8.5 8.5 3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
            </svg>
            <input type="search" id="page-search" placeholder="Filter pages" aria-label="Filter pages" autocomplete="off" />
          </label>
          <button type="button" class="link" id="sel-all">All</button>
          <button type="button" class="link" id="sel-none">None</button>
        </div>
        <div class="groups" id="page-groups" role="group" aria-label="Pages to capture"></div>
        <p class="picker-foot" id="picker-foot" aria-live="polite"></p>
      </div>
    </fieldset>

    <fieldset class="panel" id="viewports-panel">
      <legend>Viewports</legend>
      <div class="vp-row">
        <label class="vp-pick">
          <input type="checkbox" id="vp-browser" checked />
          <svg width="15" height="15" viewBox="0 0 15 15" fill="none" aria-hidden="true">
            <rect x="1.5" y="2.5" width="12" height="8" rx="1.2" stroke="currentColor" stroke-width="1.2" />
            <path d="M5.5 13h4M7.5 10.5V13" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" />
          </svg>
          <span>Browser</span>
        </label>
        <span class="vp-live" id="vp-browser-w">&mdash;</span>
        <span class="vp-px">px</span>
      </div>
      <div class="vp-row">
        <label class="vp-pick">
          <input type="checkbox" class="vp-check" />
          <svg width="15" height="15" viewBox="0 0 15 15" fill="none" aria-hidden="true">
            <rect x="1.5" y="2.5" width="12" height="8" rx="1.2" stroke="currentColor" stroke-width="1.2" />
            <path d="M5.5 13h4M7.5 10.5V13" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" />
          </svg>
          <span>Desktop</span>
        </label>
        <input type="number" class="vp-w" value="1920" min="240" max="7680" step="10" aria-label="Desktop width" />
        <span class="vp-px">px</span>
      </div>
      <div class="vp-row">
        <label class="vp-pick">
          <input type="checkbox" class="vp-check" />
          <svg width="15" height="15" viewBox="0 0 15 15" fill="none" aria-hidden="true">
            <rect x="2" y="2.5" width="11" height="7.5" rx="1.2" stroke="currentColor" stroke-width="1.2" />
            <path d="M1 12.5h13" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" />
          </svg>
          <span>Laptop</span>
        </label>
        <input type="number" class="vp-w" value="1440" min="240" max="7680" step="10" aria-label="Laptop width" />
        <span class="vp-px">px</span>
      </div>
      <div class="vp-row">
        <label class="vp-pick">
          <input type="checkbox" class="vp-check" />
          <svg width="15" height="15" viewBox="0 0 15 15" fill="none" aria-hidden="true">
            <rect x="3.5" y="1.5" width="8" height="12" rx="1.4" stroke="currentColor" stroke-width="1.2" />
            <path d="M6.5 11.8h2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" />
          </svg>
          <span>Tablet</span>
        </label>
        <input type="number" class="vp-w" value="768" min="240" max="7680" step="10" aria-label="Tablet width" />
        <span class="vp-px">px</span>
      </div>
      <div class="vp-row">
        <label class="vp-pick">
          <input type="checkbox" class="vp-check" />
          <svg width="15" height="15" viewBox="0 0 15 15" fill="none" aria-hidden="true">
            <rect x="4.5" y="1" width="6" height="13" rx="1.5" stroke="currentColor" stroke-width="1.2" />
            <path d="M6.8 12.2h1.4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" />
          </svg>
          <span>Mobile</span>
        </label>
        <input type="number" class="vp-w" value="390" min="240" max="7680" step="10" aria-label="Mobile width" />
        <span class="vp-px">px</span>
      </div>
    </fieldset>

    <fieldset class="panel">
      <legend>Export as</legend>
      <div class="chips">
        <label class="chip"><input type="radio" name="format" value="figma" checked /><span>Figma</span></label>
        <label class="chip"><input type="radio" name="format" value="sketch" /><span>Sketch</span></label>
        <label class="chip"><input type="radio" name="format" value="svg" /><span>SVG</span></label>
        <label class="chip"><input type="radio" name="format" value="html" /><span>HTML</span></label>
        <label class="chip"><input type="radio" name="format" value="json" /><span>JSON</span></label>
      </div>
      <div class="divider"></div>
      <label class="toggle-row">
        <span>Auto-scroll to load lazy content</span>
        <input type="checkbox" class="switch" id="opt-scroll-stitch" />
      </label>
    </fieldset>

    <button id="capture-btn" class="card hero">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <path d="M2.5 6.5v-3a1 1 0 0 1 1-1h3M13.5 2.5h3a1 1 0 0 1 1 1v3M17.5 13.5v3a1 1 0 0 1-1 1h-3M6.5 17.5h-3a1 1 0 0 1-1-1v-3"
          stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        <circle cx="10" cy="10" r="3.2" stroke="currentColor" stroke-width="1.6" />
      </svg>
      <span class="txt">
        <span class="title" id="capture-title">Capture page</span>
        <span class="sub" id="capture-sub">Full page at current viewport</span>
      </span>
    </button>

    <div class="grid2" id="tools">
      <button id="pick-btn" class="card pick">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
          <path d="M9 1.5v3M9 13.5v3M1.5 9h3M13.5 9h3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          <circle cx="9" cy="9" r="2.4" stroke="currentColor" stroke-width="1.5" />
        </svg>
        <span class="txt">
          <span class="title">Pick element</span>
          <span class="sub">Click on the page</span>
        </span>
      </button>
      <button id="figma-btn" class="card figma" disabled>
        <svg width="12" height="18" viewBox="0 0 12 18" fill="currentColor" aria-hidden="true">
          <path d="M6 0H3a3 3 0 0 0 0 6h3V0Z" />
          <path d="M6 0h3a3 3 0 0 1 0 6H6V0Z" opacity=".6" />
          <path d="M6 6H3a3 3 0 0 0 0 6h3V6Z" opacity=".8" />
          <circle cx="9" cy="9" r="3" opacity=".6" />
          <circle cx="3" cy="15" r="3" />
        </svg>
        <span class="txt">
          <span class="title">Copy to Figma</span>
          <span class="sub">Then paste with &#8984;V</span>
        </span>
      </button>
    </div>

    <footer id="status">
      <span class="dot"></span>
      <span id="status-text">Ready</span>
    </footer>

    <script type="module" src="./src/popup.ts"></script>
  </body>
</html>
