<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SVG heavy surface</title>
<style>*{box-sizing:border-box}body{margin:0;padding:28px;background:#eef2f1;color:#1f3d42;font:16px/1.5 Arial,sans-serif}main{max-width:1020px;margin:auto}h1{font-size:32px;margin:0 0 12px}.grid{display:grid;grid-template-columns:2fr 1fr;gap:22px}figure{margin:0;background:#fff;padding:20px;border:1px solid #a2b7b5}svg{display:block;width:100%;height:auto}figcaption{margin-top:14px;font-size:14px}.icons{display:flex;gap:22px;margin-top:22px;background:#193b42;padding:24px}.icons svg{width:64px;height:64px}.stamp{margin-top:22px;max-width:460px}@media(max-width:600px){body{padding:18px}.grid{grid-template-columns:1fr}.icons{gap:12px;padding:16px}.icons svg{width:48px;height:48px}}</style>
</head><body><main><h1>Vector surfaces and definitions</h1><p>Paths, nested groups, gradients, masks, strokes, text and reusable symbols remain visible in the reference.</p><div class="grid">
<figure><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340"><defs><linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#307d88"/><stop offset="1" stop-color="#dbecee"/></linearGradient><clipPath id="plot"><rect x="45" y="25" width="520" height="260" rx="12"/></clipPath></defs><rect width="600" height="340" fill="#f5f9f9"/><g stroke="#c0d0d0"><path d="M45 85H565M45 150H565M45 215H565M45 280H565"/><path d="M45 25V285M175 25V285M305 25V285M435 25V285M565 25V285"/></g><g clip-path="url(#plot)"><path d="M20 230C100 260 120 80 210 120S330 260 390 145S510 30 590 65V300H20Z" fill="url(#area)"/><path d="M20 230C100 260 120 80 210 120S330 260 390 145S510 30 590 65" fill="none" stroke="#235663" stroke-width="7" stroke-linecap="round"/><circle cx="390" cy="145" r="13" fill="#d67e42" stroke="#fff" stroke-width="4"/></g><g fill="#28464c" font-family="Arial" font-size="16"><text x="45" y="320">Jan</text><text x="300" y="320">Jun</text><text x="535" y="320">Dec</text></g></svg><figcaption>Chart paths with a clipped plotting area and gradient fill.</figcaption></figure>
<figure><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 340"><defs><mask id="cut"><rect width="240" height="340" fill="white"/><circle cx="120" cy="120" r="38" fill="black"/></mask></defs><rect width="240" height="340" fill="#f1dfc9"/><g mask="url(#cut)"><circle cx="120" cy="120" r="92" fill="#28606b"/><path d="M18 240L120 145L222 240L120 325Z" fill="#d67e42"/></g><g transform="translate(45 252) rotate(-12)"><rect width="150" height="44" rx="8" fill="#193b42"/><text x="75" y="29" text-anchor="middle" font-size="20" fill="white" font-family="Arial">VECTOR</text></g></svg><figcaption>Mask plus rotated grouped geometry and SVG text.</figcaption></figure></div>
<svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0" aria-hidden="true"><defs><symbol id="mark" viewBox="0 0 64 64"><path d="M12 32L26 46L52 16" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></symbol></defs></svg>
<div class="icons"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" color="#e7b477"><use href="#mark"/></svg><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><circle cx="32" cy="32" r="25" fill="none" stroke="#a7d6ce" stroke-width="5" stroke-dasharray="7 4"/></svg><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><path d="M8 48Q32 0 56 48Z" fill="#e7b477"/><path d="M18 48H46" stroke="#193b42" stroke-width="5"/></svg></div><p>SVG fixture complete. HTML raster fidelity does not verify editable vectors in a native destination.</p></main></body></html>
