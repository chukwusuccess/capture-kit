<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Backgrounds, gradients, and effects fidelity</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; background: #0f172a; color: #f8fafc; font: 14px/1.4 Arial, sans-serif; }
    h1 { margin: 0 0 16px; font-size: 22px; }
    .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
    .tile {
      height: 120px; border-radius: 10px; padding: 12px; position: relative; overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.14);
      display: flex; align-items: flex-end; font-weight: bold; font-size: 12px;
    }
    .g-linear {
      background-image: linear-gradient(125deg, #f97316 0%, #ec4899 48%, #6366f1 100%);
    }
    .g-radial {
      background-color: #1e293b;
      background-image: radial-gradient(circle 55px at 30% 35%, #38bdf8, #3b82f6 55%, rgba(30, 41, 59, 0) 100%);
    }
    .g-conic {
      background-image: conic-gradient(from 45deg at 50% 45%, #f43f5e, #f59e0b, #10b981, #3b82f6, #f43f5e);
    }
    .g-stacked {
      background-color: #1e1b4b;
      background-image:
        linear-gradient(to right, rgba(255, 255, 255, 0.14) 1px, transparent 1px),
        radial-gradient(circle at 75% 28%, rgba(244, 114, 182, 0.9), transparent 55%),
        linear-gradient(160deg, rgba(14, 165, 233, 0.75), rgba(99, 102, 241, 0.25));
      background-size: 24px 24px, 100% 100%, 100% 100%;
      background-position: 0 0, 0 0, 0 0;
    }
    .bg-clip-text {
      background: #1e293b;
      align-items: center; justify-content: center;
    }
    .bg-clip-text span {
      font-size: 28px; font-weight: 800;
      background-image: linear-gradient(90deg, #38bdf8, #a855f7, #f43f5e);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .backdrop {
      background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 50%, #9333ea 100%);
      align-items: center; justify-content: center;
    }
    .backdrop-glass {
      padding: 12px 18px; border-radius: 8px;
      background: rgba(15, 23, 42, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .filter-blur {
      background: #1e293b;
      align-items: center; justify-content: center;
    }
    .filter-blur .orb {
      width: 68px; height: 68px; border-radius: 50%;
      background: linear-gradient(135deg, #fbbf24, #ef4444);
      filter: blur(4px);
    }
    .mask-box {
      background: #1e293b;
      align-items: center; justify-content: center;
    }
    .mask-box .masked {
      width: 100%; height: 80px; border-radius: 8px;
      background: linear-gradient(90deg, #22c55e, #06b6d4);
      -webkit-mask-image: linear-gradient(to right, rgba(0, 0, 0, 1) 20%, rgba(0, 0, 0, 0) 100%);
      mask-image: linear-gradient(to right, rgba(0, 0, 0, 1) 20%, rgba(0, 0, 0, 0) 100%);
    }
    .clip-basic {
      background: #1e293b;
      align-items: center; justify-content: center;
    }
    .clip-basic .poly {
      width: 90px; height: 80px;
      background: linear-gradient(135deg, #facc15, #f97316);
      clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%);
    }
    .blend-box {
      background: linear-gradient(90deg, #ef4444 0 50%, #3b82f6 50% 100%);
      align-items: center; justify-content: center;
    }
    .blend-box .blend-child {
      width: 84px; height: 64px; border-radius: 8px;
      background: #facc15;
      mix-blend-mode: multiply;
    }
    .shadows {
      background: #1e293b;
      align-items: center; justify-content: center;
    }
    .shadows .card-shadow {
      width: 120px; height: 64px; border-radius: 8px;
      background: #334155;
      box-shadow:
        inset 0 2px 6px rgba(255, 255, 255, 0.28),
        0 8px 18px rgba(0, 0, 0, 0.55),
        0 0 0 2px rgba(56, 189, 248, 0.5);
    }
    footer { margin-top: 16px; font-size: 12px; color: #94a3b8; }
    @media (max-width: 600px) {
      body { padding: 16px; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <h1>Backgrounds &amp; Effects Fixture</h1>
  <div class="grid">
    <div class="tile g-linear">Linear gradient</div>
    <div class="tile g-radial">Radial gradient</div>
    <div class="tile g-conic">Conic gradient</div>
    <div class="tile g-stacked">Stacked gradients</div>
    <div class="tile bg-clip-text"><span>CLIP TEXT</span></div>
    <div class="tile backdrop"><div class="backdrop-glass">Backdrop blur</div></div>
    <div class="tile filter-blur"><div class="orb"></div></div>
    <div class="tile mask-box"><div class="masked"></div></div>
    <div class="tile clip-basic"><div class="poly"></div></div>
    <div class="tile blend-box"><div class="blend-child"></div></div>
    <div class="tile shadows"><div class="card-shadow"></div></div>
  </div>
  <footer>Backgrounds fixture complete</footer>
</body>
</html>
