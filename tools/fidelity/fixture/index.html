<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Replica fixture</title>
<link rel="stylesheet" href="{{XORIGIN}}/cross.css">
<style>
  @import "imported.css";
  :not(:defined) { display: none; }
  body { margin: 0; font: 16px/1.45 system-ui, sans-serif; color: #1e1e1e; background: #f5f5f5; }
  .hero { height: 220px; display: grid; place-items: center; color: #fff; }
  .hero h1 { margin: 0; font-size: 44px; letter-spacing: -0.02em; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; padding: 24px; }
  .grid > * { min-height: 100px; }
  .waapi { background: #ffe9a8; padding: 20px; border-radius: 12px; }
  canvas, img { max-width: 100%; display: block; }
  form { display: grid; gap: 8px; }
  @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } .hero h1 { font-size: 30px; } }
</style>
</head>
<body>
<header class="hero" style="background: url(bg.svg) center / cover">
  <h1>Replica fixture</h1>
</header>
<main class="grid">
  <div class="js-css">Styled by insertRule</div>
  <fancy-card>Slotted light DOM</fancy-card>
  <canvas id="c" width="300" height="120"></canvas>
  <div class="waapi" style="opacity: 0; transform: translateY(30px)">Faded in by element.animate</div>
  <form>
    <input id="name" value="default value">
    <label><input type="checkbox" id="cb"> Checked by script</label>
    <select id="sel"><option>One</option><option>Two</option></select>
    <textarea id="ta">original text</textarea>
  </form>
  <details open><summary>Open details</summary>Body text inside details.</details>
  <picture>
    <source media="(max-width: 600px)" srcset="small.svg">
    <img src="large.svg" width="300" height="120" alt="">
  </picture>
  <iframe id="fr" width="300" height="120" style="border: 1px solid #ccc; background: #fff"></iframe>
  <svg width="300" height="120" viewBox="0 0 300 120">
    <defs>
      <linearGradient id="g"><stop offset="0" stop-color="#ff5a26"/><stop offset="1" stop-color="#0d99ff"/></linearGradient>
      <symbol id="star" viewBox="0 0 24 24"><path d="M12 2l3 7h7l-5.5 4.5 2 7.5-6.5-4.5-6.5 4.5 2-7.5L2 9h7z"/></symbol>
    </defs>
    <rect width="300" height="120" rx="12" fill="url(#g)"/>
    <use href="#star" x="110" y="20" width="80" height="80" fill="#fff"/>
  </svg>
  <div class="xo">Styled by a cross-origin sheet</div>
  <div class="imp">Styled by an @import</div>
  <div class="adopted">Styled by document.adoptedStyleSheets</div>
</main>
<script>
  const style = document.head.appendChild(document.createElement('style'));
  style.sheet.insertRule('.js-css { background: #0d99ff; color: #fff; padding: 24px; border-radius: 12px; font-weight: 600 }');

  customElements.define('fancy-card', class extends HTMLElement {
    constructor() {
      super();
      const root = this.attachShadow({ mode: 'closed' });
      const sheet = new CSSStyleSheet();
      sheet.replaceSync(':host { display: block; padding: 20px; background: #fde; border: 2px solid #c36; border-radius: 12px } b { color: #c36 }');
      root.adoptedStyleSheets = [sheet];
      root.innerHTML = '<b>Closed shadow root</b><br><slot></slot>';
    }
  });

  const c = document.getElementById('c').getContext('2d');
  const grad = c.createLinearGradient(0, 0, 300, 0);
  grad.addColorStop(0, '#2b2'); grad.addColorStop(1, '#22b');
  c.fillStyle = grad; c.fillRect(0, 0, 300, 120);
  c.fillStyle = '#fff'; c.font = 'bold 24px sans-serif'; c.fillText('Drawn on canvas', 40, 68);

  document.querySelector('.waapi').animate(
    [{ opacity: 0, transform: 'translateY(30px)' }, { opacity: 1, transform: 'none' }],
    { duration: 30, fill: 'forwards' }
  );

  document.getElementById('name').value = 'Typed by the user';
  document.getElementById('cb').checked = true;
  document.getElementById('sel').value = 'Two';
  document.getElementById('ta').value = 'Typed into the textarea';

  document.getElementById('fr').contentDocument.body.innerHTML =
    '<p style="margin:16px;color:#080;font:20px system-ui">Written into an iframe</p>';

  const adopted = new CSSStyleSheet();
  adopted.replaceSync('.adopted { outline: 3px dashed #3a3; padding: 20px; background: #efe }');
  document.adoptedStyleSheets = [adopted];
</script>
</body>
</html>
